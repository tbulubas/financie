<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financie</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --text:#e8ecf4; --muted:#8b96ab; --accent:#4f8cff;
          --green:#3ecf8e; --red:#ff6b6b; --border:#2a3450; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0 16px 0 0; }
  nav button { background:none; border:none; color:var(--muted); font-size:15px; padding:8px 14px; cursor:pointer; border-radius:8px; }
  nav button.active { color:var(--text); background:var(--card); }
  .hright { margin-left:auto; display:flex; align-items:center; gap:12px; }
  #gemmaStatus { font-size:13px; color:var(--muted); }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .card .label { color:var(--muted); font-size:13px; margin-bottom:6px; }
  .card .value { font-size:26px; font-weight:600; }
  .green { color:var(--green); } .red { color:var(--red); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .row { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  td.num { text-align:right; white-space:nowrap; }
  td.nowrap, th.nowrap { white-space:nowrap; }
  /* fixed column widths in Transactions so the layout doesn't jump with content */
  #txTable { table-layout:fixed; }
  #txTable col.c-date { width:104px; } #txTable col.c-acct { width:132px; }
  #txTable col.c-cparty { width:22%; } #txTable col.c-cat { width:170px; }
  #txTable col.c-amt { width:110px; }  #txTable col.c-del { width:44px; }
  #txTable td { overflow:hidden; text-overflow:ellipsis; }
  #txTable select { width:100%; }
  select, input, button.btn { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:14px; }
  button.btn { cursor:pointer; } button.btn.primary { background:var(--accent); border-color:var(--accent); }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .bar { background:var(--bg); border-radius:6px; height:8px; overflow:hidden; }
  .bar > div { height:100%; background:var(--green); }
  .bar > div.over { background:var(--red); }
  .hidden { display:none; }
  h2 { font-size:17px; margin:0 0 12px; }
  .msg { padding:10px 14px; border-radius:8px; background:var(--card); border:1px solid var(--border); margin-bottom:14px; }
  .hint { color:var(--muted); font-size:13px; }
  .scroll-x { overflow-x:auto; }
  #impTable td.file { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #impTable select { max-width:220px; }
</style>
</head>
<body>
<header>
  <h1>💶 <span data-i18n="app_title">Financie</span></h1>
  <nav>
    <button data-tab="overview" class="active" data-i18n="nav_overview"></button>
    <button data-tab="transactions" data-i18n="nav_transactions"></button>
    <button data-tab="budget" data-i18n="nav_budget"></button>
    <button data-tab="assets" data-i18n="nav_assets"></button>
    <button data-tab="import" data-i18n="nav_import"></button>
  </nav>
  <div class="hright">
    <span id="gemmaStatus"></span>
    <select id="langSel">
      <option value="sk">SK</option><option value="de">DE</option><option value="en">EN</option>
    </select>
  </div>
</header>
<main>

<section id="tab-overview">
  <div class="toolbar">
    <select id="ovPreset">
      <option value="this_month" data-i18n="p_this_month"></option>
      <option value="last_month" data-i18n="p_last_month"></option>
      <option value="this_year" data-i18n="p_this_year"></option>
      <option value="last_year" data-i18n="p_last_year"></option>
      <option value="all" data-i18n="p_all"></option>
      <option value="custom" data-i18n="p_custom"></option>
    </select>
    <button class="btn" onclick="shiftPeriod(-1)">◀</button>
    <input type="date" id="ovFrom"> – <input type="date" id="ovTo">
    <button class="btn" onclick="shiftPeriod(1)">▶</button>
  </div>
  <div class="cards">
    <div class="card"><div class="label" data-i18n="income"></div><div class="value green" id="ovIncome">–</div></div>
    <div class="card"><div class="label" data-i18n="expenses"></div><div class="value red" id="ovExpense">–</div></div>
    <div class="card"><div class="label" data-i18n="month_balance"></div><div class="value" id="ovNet">–</div></div>
    <div class="card"><div class="label" data-i18n="net_worth"></div><div class="value" id="ovNW">–</div></div>
  </div>
  <div class="row">
    <div class="card"><h2 data-i18n="expenses_by_cat"></h2><canvas id="catChart"></canvas></div>
    <div class="card"><h2 data-i18n="monthly_trend"></h2><canvas id="monthChart"></canvas></div>
  </div>
</section>

<section id="tab-transactions" class="hidden">
  <div class="toolbar">
    <input type="month" id="txMonth">
    <select id="txAccount"></select>
    <input type="search" id="txSearch" data-i18n-ph="search_ph">
    <label><input type="checkbox" id="txUncat"> <span data-i18n="only_uncat"></span></label>
    <button class="btn" onclick="recat()">🤖 <span data-i18n="recat_btn"></span></button>
    <span id="recatMsg" class="hint"></span>
  </div>
  <div class="card"><table id="txTable">
    <colgroup>
      <col class="c-date"><col class="c-acct"><col><col class="c-cparty">
      <col class="c-cat"><col class="c-amt"><col class="c-del">
    </colgroup>
    <thead><tr><th data-i18n="col_date"></th><th data-i18n="col_account"></th><th data-i18n="col_desc"></th><th data-i18n="col_cparty"></th><th data-i18n="col_cat"></th><th class="num" data-i18n="col_amount"></th><th></th></tr></thead>
    <tbody></tbody></table></div>
</section>

<section id="tab-budget" class="hidden">
  <div class="toolbar"><input type="month" id="buMonth"><span class="hint" data-i18n="budget_hint"></span></div>
  <div class="toolbar">
    <input id="newCatName" data-i18n-ph="new_cat_ph">
    <select id="newCatKind"><option value="expense" data-i18n="kind_expense"></option><option value="income" data-i18n="kind_income"></option></select>
    <button class="btn" onclick="addCat()" data-i18n="add_cat_btn"></button>
  </div>
  <div class="card"><table id="buTable">
    <thead><tr><th data-i18n="col_cat"></th><th class="num" data-i18n="col_limit"></th><th class="num" data-i18n="col_spent"></th><th style="width:30%" data-i18n="col_progress"></th><th></th></tr></thead>
    <tbody></tbody></table></div>
</section>

<section id="tab-assets" class="hidden">
  <div class="cards">
    <div class="card"><div class="label" data-i18n="accounts_total"></div><div class="value" id="nwAccounts">–</div></div>
    <div class="card"><div class="label" data-i18n="assets_liabilities"></div><div class="value" id="nwAssets">–</div></div>
    <div class="card"><div class="label" data-i18n="net_worth"></div><div class="value" id="nwTotal">–</div></div>
  </div>
  <div class="row">
    <div class="card">
      <h2 data-i18n="assets_liabilities"></h2>
      <table id="assetTable"><thead><tr><th data-i18n="col_name"></th><th data-i18n="col_type"></th><th class="num" data-i18n="col_value"></th><th></th></tr></thead><tbody></tbody></table>
      <div class="toolbar" style="margin-top:12px">
        <input id="newAssetName" data-i18n-ph="asset_name_ph">
        <select id="newAssetType">
          <option value="real_estate" data-i18n="at_real_estate"></option><option value="etf">ETF</option>
          <option value="stocks" data-i18n="at_stocks"></option><option value="crypto" data-i18n="at_crypto"></option>
          <option value="pension" data-i18n="at_pension"></option><option value="liability" data-i18n="at_liability"></option>
          <option value="other" data-i18n="at_other"></option>
        </select>
        <button class="btn primary" onclick="addAsset()" data-i18n="add_btn"></button>
      </div>
      <div class="toolbar">
        <select id="valAsset"></select>
        <input type="date" id="valDate">
        <input type="number" step="0.01" id="valValue" data-i18n-ph="value_ph">
        <button class="btn" onclick="addValue()" data-i18n="save_valuation"></button>
      </div>
    </div>
    <div class="card"><h2 data-i18n="asset_trend"></h2><canvas id="nwChart"></canvas></div>
  </div>
</section>

<section id="tab-import" class="hidden">
  <div class="msg" data-i18n-html="import_info"></div>
  <div class="card">
    <div class="toolbar">
      <input type="file" id="impFiles" multiple accept=".csv,.xlsx,.xls,.pdf,.png,.jpg,.jpeg,.webp">
      <button class="btn primary" id="impAllBtn" onclick="importAll()" data-i18n="import_all_btn" disabled></button>
    </div>
    <div id="impResult" class="hint"></div>
    <div class="scroll-x"><table id="impTable" class="hidden" style="margin-top:8px">
      <thead><tr><th></th><th data-i18n="col_file"></th><th data-i18n="col_format"></th><th data-i18n="col_period"></th>
        <th class="num" data-i18n="col_rows"></th><th data-i18n="col_account"></th><th data-i18n="col_status"></th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="toolbar" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px">
      <input id="newAccName" data-i18n-ph="acc_name_ph">
      <select id="newAccType">
        <option value="checking" data-i18n="acct_checking"></option>
        <option value="savings" data-i18n="acct_savings"></option>
        <option value="credit_card" data-i18n="acct_credit_card"></option>
        <option value="cash" data-i18n="acct_cash"></option>
        <option value="investment" data-i18n="acct_investment"></option>
        <option value="other" data-i18n="acct_other"></option>
      </select>
      <button class="btn" onclick="addAccount()" data-i18n="add_acc_btn"></button>
      <span class="hint" data-i18n="acc_hint"></span>
    </div>
    <table id="accTable" style="margin-top:8px">
      <thead><tr><th data-i18n="col_name"></th><th data-i18n="col_type"></th><th class="num" data-i18n="col_balance"></th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

</main>

let lang = localStorage.getItem('lang') || 'sk';
const t = k => I18N[lang][k] ?? I18N.sk[k] ?? k;
// default categories have a key and are translated; user-defined ones show their own name
const catLabel = (key, name) => (key && I18N[lang]['cat_'+key]) || name;
const byLabel = (a, b) => a.label.localeCompare(b.label, LOCALE[lang]);
const LOCALE = {sk:'sk-SK', de:'de-DE', en:'en-GB'};

function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
}

const $ = s => document.querySelector(s);
const fmt = n => (n==null?'–':n.toLocaleString(LOCALE[lang],{style:'currency',currency:'EUR'}));
// local calendar date as YYYY-MM-DD; toISOString() would convert to UTC and shift the day
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const thisMonth = ymd(new Date()).slice(0,7);
let categories = [], charts = {};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));
  b.classList.add('active');
  $('#tab-'+b.dataset.tab).classList.remove('hidden');
  load(b.dataset.tab);
});

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) {
    let d; try { d = (await r.json()).detail; } catch { d = r.statusText; }
    if (d && typeof d === 'object' && d.code)
      throw new Error(t('err_'+d.code) + (d.info ? ': '+d.info : ''));
    throw new Error(typeof d === 'string' ? d : r.statusText);
  }
  return r.json();
}

function chart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($('#'+id), cfg);
}

function presetRange(p) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  switch (p) {
    case 'this_month': return [ymd(new Date(y, m, 1)), ymd(new Date(y, m+1, 0))];
    case 'last_month': return [ymd(new Date(y, m-1, 1)), ymd(new Date(y, m, 0))];
    case 'this_year':  return [`${y}-01-01`, `${y}-12-31`];
    case 'last_year':  return [`${y-1}-01-01`, `${y-1}-12-31`];
    case 'all':        return ['1970-01-01', '2100-12-31'];
    default:           return [$('#ovFrom').value, $('#ovTo').value];
  }
}

function shiftPeriod(dir) {
  const from = new Date($('#ovFrom').value), to = new Date($('#ovTo').value);
  if (isNaN(from) || isNaN(to)) return;
  const iso = d => d.toISOString().slice(0,10);
  const isMonthStart = from.getUTCDate() === 1;
  const nextDay = new Date(to); nextDay.setUTCDate(nextDay.getUTCDate() + 1);
  const isMonthEnd = nextDay.getUTCDate() === 1;
  if (isMonthStart && isMonthEnd) {
    // whole calendar months -> shift by the same number of months
    const months = (to.getUTCFullYear()-from.getUTCFullYear())*12
                 + (to.getUTCMonth()-from.getUTCMonth()) + 1;
    const nf = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth() + dir*months, 1));
    const nt = new Date(Date.UTC(nf.getUTCFullYear(), nf.getUTCMonth() + months, 0));
    $('#ovFrom').value = iso(nf); $('#ovTo').value = iso(nt);
  } else {
    const days = Math.round((to - from) / 86400000) + 1;
    from.setUTCDate(from.getUTCDate() + dir*days);
    to.setUTCDate(to.getUTCDate() + dir*days);
    $('#ovFrom').value = iso(from); $('#ovTo').value = iso(to);
  }
  $('#ovPreset').value = 'custom';
  loadOverview();
}

async function loadOverview() {
  const p = $('#ovPreset').value;
  const [from, to] = presetRange(p);
  if (p !== 'custom') { $('#ovFrom').value = from; $('#ovTo').value = to; }
  if (!from || !to) return;
  const [ov, nw] = await Promise.all([
    api(`/api/overview?date_from=${from}&date_to=${to}`), api('/api/networth')]);
  $('#ovIncome').textContent = fmt(ov.income);
  $('#ovExpense').textContent = fmt(ov.expense);
  const net = ov.income + ov.expense;
  $('#ovNet').textContent = fmt(net); $('#ovNet').className = 'value ' + (net>=0?'green':'red');
  $('#ovNW').textContent = fmt(nw.net_worth);
  chart('catChart', {type:'doughnut', data:{labels:ov.by_category.map(x=>catLabel(x.category_key, x.category)),
    datasets:[{data:ov.by_category.map(x=>x.spent)}]},
    options:{plugins:{legend:{position:'right',labels:{color:'#e8ecf4'}}}}});
  chart('monthChart', {type:'bar', data:{labels:ov.monthly.map(x=>x.month),
    datasets:[{label:t('income'),data:ov.monthly.map(x=>x.income),backgroundColor:'#3ecf8e'},
              {label:t('expenses'),data:ov.monthly.map(x=>x.expense),backgroundColor:'#ff6b6b'}]},
    options:{scales:{x:{ticks:{color:'#8b96ab'}},y:{ticks:{color:'#8b96ab'}}},
             plugins:{legend:{labels:{color:'#e8ecf4'}}}}});
}

async function loadTransactions() {
  {
    const accs = await api('/api/accounts');
    const cur = $('#txAccount').value;
    $('#txAccount').innerHTML = `<option value="">${t('all_accounts')}</option>` +
      accs.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
    $('#txAccount').value = cur;
  }
  const p = new URLSearchParams();
  if ($('#txMonth').value) p.set('month', $('#txMonth').value);
  if ($('#txAccount').value) p.set('account_id', $('#txAccount').value);
  if ($('#txSearch').value) p.set('q', $('#txSearch').value);
  if ($('#txUncat').checked) p.set('uncategorized','true');
  const txs = await api('/api/transactions?'+p);
  // the API sorts by kind and English name; keep the kinds together, sort each by the shown label
  const cats = categories.map(c => ({...c, label: catLabel(c.key, c.name)}))
    .sort((a, b) => a.kind.localeCompare(b.kind) || byLabel(a, b));
  const opts = cid => '<option value="">—</option>' + cats.map(c =>
    `<option value="${c.id}" ${c.id===cid?'selected':''}>${c.label}</option>`).join('');
  $('#txTable tbody').innerHTML = txs.map(t2 => `<tr>
    <td class="nowrap">${t2.date}</td><td class="hint nowrap">${t2.account}</td>
    <td class="nowrap" title="${(t2.description||'').replace(/"/g,'&quot;')}">${t2.description||''}</td>
    <td class="nowrap" title="${(t2.counterparty||'').replace(/"/g,'&quot;')}">${t2.counterparty||''}</td>
    <td><select onchange="setCat(${t2.id}, this.value)">${opts(t2.category_id)}</select></td>
    <td class="num ${t2.amount>=0?'green':'red'}">${fmt(t2.amount)}</td>
    <td><button class="btn" onclick="delTx(${t2.id})">✕</button></td></tr>`).join('');
}
async function setCat(id, v) {
  await api('/api/transactions/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category_id: v?+v:null})});
}
async function delTx(id) {
  if (!confirm(t('del_tx_confirm'))) return;
  await api('/api/transactions/'+id, {method:'DELETE'}); loadTransactions();
}
async function recat() {
  $('#recatMsg').textContent = t('recat_working');
  try {
    const r = await api('/api/categorize', {method:'POST'});
    $('#recatMsg').textContent = t('recat_done')(r.learned + r.categorized, r.remaining);
    loadTransactions();
  } catch(e) { $('#recatMsg').textContent = t('error')+': '+e.message; }
}

async function loadBudget() {
  const m = $('#buMonth').value || thisMonth;
  const b = await api('/api/budget?month='+m);
  const items = b.items.map(i => ({...i, label: catLabel(i.category_key, i.category)})).sort(byLabel);
  $('#buTable tbody').innerHTML = items.map(i => {
    const pct = i.budget ? Math.min(100, i.spent/i.budget*100) : 0;
    const label = i.label;
    return `<tr><td>${label}</td>
      <td class="num"><input type="number" style="width:90px" value="${i.budget??''}"
        onkeydown="if(event.key==='Enter')saveBudget(${i.category_id},this.value)"></td>
      <td class="num">${fmt(i.spent)}</td>
      <td>${i.budget?`<div class="bar"><div class="${i.spent>i.budget?'over':''}" style="width:${pct}%"></div></div>`:''}</td>
      <td><button class="btn" onclick="delCat(${i.category_id}, '${label.replace(/'/g,"\\'")}')">✕</button></td></tr>`;
  }).join('');
}
async function saveBudget(cid, v) {
  await api('/api/budget', {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category_id:cid, amount:+v||0})});
  loadBudget();
}
async function addCat() {
  try {
    await api('/api/categories', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:$('#newCatName').value, kind:$('#newCatKind').value})});
    $('#newCatName').value='';
    categories = await api('/api/categories');
    loadBudget();
  } catch(e) { alert(e.message); }
}
async function delCat(id, name) {
  if (!confirm(t('del_cat_confirm')(name))) return;
  await api('/api/categories/'+id, {method:'DELETE'});
  categories = await api('/api/categories');
  loadBudget();
}

async function loadAssets() {
  const nw = await api('/api/networth');
  $('#nwAccounts').textContent = fmt(nw.total_accounts);
  $('#nwAssets').textContent = fmt(nw.total_assets);
  $('#nwTotal').textContent = fmt(nw.net_worth);
  $('#assetTable tbody').innerHTML = nw.assets.map(a => `<tr>
    <td>${a.name}</td><td>${t('at_'+a.type) !== 'at_'+a.type ? t('at_'+a.type) : a.type}</td>
    <td class="num ${(a.value||0)>=0?'':'red'}">${fmt(a.value)}${a.date?` <small class="hint">(${a.date})</small>`:''}</td>
    <td><button class="btn" onclick="delAsset(${a.id})">✕</button></td></tr>`).join('');
  $('#valAsset').innerHTML = nw.assets.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  $('#valDate').value = ymd(new Date());
  chart('nwChart', {type:'line', data:{labels:nw.history.map(x=>x.date),
    datasets:[{label:t('assets_liabilities'), data:nw.history.map(x=>x.assets_total),
    borderColor:'#4f8cff', tension:.2}]},
    options:{scales:{x:{ticks:{color:'#8b96ab'}},y:{ticks:{color:'#8b96ab'}}},
             plugins:{legend:{labels:{color:'#e8ecf4'}}}}});
}
async function addAsset() {
  await api('/api/assets', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:$('#newAssetName').value, type:$('#newAssetType').value})});
  $('#newAssetName').value=''; loadAssets();
}
async function delAsset(id) {
  if (!confirm(t('del_asset_confirm'))) return;
  await api('/api/assets/'+id, {method:'DELETE'}); loadAssets();
}
async function addValue() {
  await api('/api/asset_values', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({asset_id:+$('#valAsset').value, date:$('#valDate').value, value:+$('#valValue').value})});
  $('#valValue').value=''; loadAssets();
}

async function addAccount() {
  try {
    await api('/api/accounts', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name:$('#newAccName').value, type:$('#newAccType').value})});
    $('#newAccName').value=''; loadImport();
  } catch(e) { alert(e.message); }
}
async function loadImport() {
  const accs = await api('/api/accounts');
  $('#accTable tbody').innerHTML = accs.map(a => `<tr>
    <td>${a.name}</td><td class="hint">${t('acct_'+a.type) !== 'acct_'+a.type ? t('acct_'+a.type) : a.type}</td>
    <td class="num">${fmt(a.balance)}</td>
    <td><button class="btn" onclick="delAccount(${a.id}, '${a.name.replace(/'/g,"\\'")}')">✕</button></td></tr>`).join('');
  return accs;
}
async function delAccount(id, name) {
  if (!confirm(t('del_acc_confirm')(name))) return;
  try { await api('/api/accounts/'+id, {method:'DELETE'}); loadImport(); }
  catch(e) { alert(e.message); }
}

// several statements at once: the server says what each file is and where it belongs
let impRows = [];
async function previewFiles() {
  const files = [...$('#impFiles').files];
  $('#impTable').classList.toggle('hidden', !files.length);
  $('#impAllBtn').disabled = true;
  if (!files.length) return;
  $('#impResult').textContent = t('analyzing');
  const fd = new FormData();
  files.forEach(f => fd.append('files', f));
  try {
    const rows = await api('/api/import/preview', {method:'POST', body:fd});
    rows.forEach((r, i) => { r.fileObj = files[i]; });
    // known formats first, grouped by account source, oldest period first
    impRows = rows.sort((a, b) => (a.gemma - b.gemma) || (a.key||'').localeCompare(b.key||'')
                                   || (a.date_from||'').localeCompare(b.date_from||''));
    $('#impResult').textContent = '';
    renderImpTable(await loadImport());
  } catch(e) { $('#impResult').textContent = t('error')+': '+e.message; }
}
function renderImpTable(accs) {
  const proposals = [...new Map(impRows.filter(r => r.proposal && !accs.some(a => a.name === r.proposal.name))
                                       .map(r => [r.proposal.name, r.proposal])).values()];
  const options = r => {
    const sel = r.account_id ? String(r.account_id)
              : r.proposal && proposals.some(p => p.name === r.proposal.name) ? 'new:'+r.proposal.name : '';
    return `<option value="">${t('choose_account')}</option>` +
      accs.map(a => `<option value="${a.id}" ${String(a.id)===sel?'selected':''}>${a.name}</option>`).join('') +
      proposals.map(p => `<option value="new:${p.name}" ${'new:'+p.name===sel?'selected':''}>${t('new_account_opt')(p.name)}</option>`).join('');
  };
  $('#impTable tbody').innerHTML = impRows.map((r, i) => {
    const empty = r.count === 0, usable = !r.error && !empty;
    const period = r.date_from ? `${r.date_from} – ${r.date_to}` : '–';
    const status = r.error ? t('error')+': '+r.error : empty ? t('imp_empty') : '';
    return `<tr>
      <td><input type="checkbox" id="impChk${i}" ${usable && !r.gemma ? 'checked' : ''} ${usable ? '' : 'disabled'}></td>
      <td class="file" title="${r.file}">${r.file}</td>
      <td>${r.format || (r.gemma ? t('fmt_gemma') : '–')}</td>
      <td class="nowrap hint">${period}</td>
      <td class="num">${r.count ?? '–'}</td>
      <td><select id="impAcc${i}" ${usable ? '' : 'disabled'}>${options(r)}</select></td>
      <td class="hint" id="impStatus${i}">${status}</td></tr>`;
  }).join('');
  $('#impAllBtn').disabled = !impRows.some(r => !r.error && r.count !== 0);
}
async function importAll() {
  $('#impAllBtn').disabled = true;
  const created = {};
  for (const [i, r] of impRows.entries()) {
    if (!$('#impChk'+i).checked) continue;
    const status = $('#impStatus'+i);
    let acc = $('#impAcc'+i).value;
    if (!acc) { status.textContent = t('imp_need_account'); continue; }
    try {
      if (acc.startsWith('new:')) {
        const p = impRows.find(x => x.proposal && 'new:'+x.proposal.name === acc).proposal;
        if (!created[p.name]) {
          await api('/api/accounts', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({name:p.name, type:p.type})});
          created[p.name] = (await api('/api/accounts')).find(a => a.name === p.name).id;
        }
        acc = created[p.name];
      }
      status.textContent = t('imp_running');
      const fd = new FormData();
      fd.append('account_id', acc);
      fd.append('file', r.fileObj);
      status.textContent = t('imp_row_done')(await api('/api/import', {method:'POST', body:fd}));
      $('#impChk'+i).checked = false;
    } catch(e) { status.textContent = t('error')+': '+e.message; }
  }
  const accs = await loadImport();
  // newly created accounts become ordinary choices for the rows still left
  impRows.forEach((r, i) => { const sel = $('#impAcc'+i); r.account_id = +sel.value || created[(sel.value||'').slice(4)] || r.account_id; });
  const statuses = impRows.map((_, i) => $('#impStatus'+i).textContent);
  const checks = impRows.map((_, i) => $('#impChk'+i).checked);
  renderImpTable(accs);
  impRows.forEach((_, i) => { $('#impStatus'+i).textContent = statuses[i]; $('#impChk'+i).checked = checks[i]; });
}

function load(tab) {
  ({overview:loadOverview, transactions:loadTransactions, budget:loadBudget,
    assets:loadAssets, import:loadImport}[tab])();
}

async function refreshStatus() {
  const st = await api('/api/status');
  $('#gemmaStatus').textContent = st.gemma ? t('gemma_ready')(st.model) : t('gemma_off');
  $('#gemmaStatus').style.color = st.gemma ? '#3ecf8e' : '#8b96ab';
}

$('#langSel').value = lang;
$('#langSel').onchange = () => {
  lang = $('#langSel').value;
  localStorage.setItem('lang', lang);
  applyI18n(); refreshStatus();
  load(document.querySelector('nav .active').dataset.tab);
};

(async function init() {
  applyI18n();
  $('#txMonth').value = $('#buMonth').value = thisMonth;
  $('#ovPreset').addEventListener('change', loadOverview);
  $('#impFiles').addEventListener('change', previewFiles);
  ['#ovFrom','#ovTo'].forEach(s => $(s).addEventListener('change', () => {
    $('#ovPreset').value = 'custom'; loadOverview();
  }));
  ['#txMonth','#txAccount','#txSearch','#txUncat','#buMonth'].forEach(s =>
    $(s).addEventListener('change', () => load(document.querySelector('nav .active').dataset.tab)));
  categories = await api('/api/categories');
  refreshStatus();
  loadOverview();
})();
</script>
