<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financie</title>
<script src="/static/vendor/chart.umd.js"></script>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --text:#e8ecf4; --muted:#8b96ab; --accent:#4f8cff;
          --green:#3ecf8e; --red:#ff6b6b; --border:#2a3450; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:16px; padding:14px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0 16px 0 0; }
  nav button { background:none; border:none; color:var(--muted); font-size:15px; padding:8px 14px; cursor:pointer; border-radius:8px; }
  nav button.active { color:var(--text); background:var(--card); }
  .hright { margin-left:auto; display:flex; align-items:center; gap:12px; }
  #gemmaStatus { font-size:13px; color:var(--muted); }
  main { padding:24px; max-width:1240px; margin:0 auto; }   /* the import table needs the width */
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .card .label { color:var(--muted); font-size:13px; margin-bottom:6px; }
  .card .value { font-size:26px; font-weight:600; }
  .green { color:var(--green); } .red { color:var(--red); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  /* overview panels: shown or hidden from the 📊 menu, collapsed by clicking their title */
  #ovPanels[open] > div { right:0; }   /* near the right edge: open to the left */
  .panels { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }   /* collapsed = title only */
  .panels > .panel { flex:1 1 420px; min-width:0; }
  .panels > .panel.wide { flex-basis:100%; }
  .panel-head { cursor:pointer; user-select:none; display:flex; align-items:center; gap:8px; }
  .panel-head::before { content:'▾'; color:var(--muted); font-size:13px; transition:transform .15s; }
  .panel.collapsed .panel-head { margin-bottom:0; }
  .panel.collapsed .panel-head::before { transform:rotate(-90deg); }
  .panel.collapsed .panel-body { display:none; }
  .bal-chart { position:relative; height:340px; }
  .chart-box { position:relative; height:300px; }   /* the same height at half or full width */
  @media (max-width:800px){ .row { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  td.num { text-align:right; white-space:nowrap; }
  td.nowrap, th.nowrap { white-space:nowrap; }
  /* fixed column widths in Transactions so the layout doesn't jump with content */
  #txTable { table-layout:fixed; }
  #txTable col.c-date { width:104px; } #txTable col.c-acct { width:132px; }
  #txTable col.c-cparty { width:22%; } #txTable col.c-cat { width:170px; }
  #txTable col.c-amt { width:110px; }  #txTable col.c-del { width:44px; }
  #txTable td { overflow:hidden; text-overflow:ellipsis; }
  #txTable select { width:100%; }
  select, input, button.btn { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:14px; }
  button.btn { cursor:pointer; } button.btn.primary { background:var(--accent); border-color:var(--accent); }
  .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .bar { background:var(--bg); border-radius:6px; height:8px; overflow:hidden; }
  .bar > div { height:100%; background:var(--green); }
  .bar > div.over { background:var(--red); }
  .hidden { display:none; }
  h2 { font-size:17px; margin:0 0 12px; }
  .msg { padding:10px 14px; border-radius:8px; background:var(--card); border:1px solid var(--border); margin-bottom:14px; }
  .hint { color:var(--muted); font-size:13px; }
  .scroll-x { overflow-x:auto; }
  #impTable td.file, #histTable td.file { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #impTable select { max-width:220px; }
  #impTable td.state, #histTable td.state { white-space:nowrap; }
  #histTable a.warn { cursor:pointer; text-decoration:underline dotted; }
  #histTable tr.dups > td { background:var(--bg); }
  #histTable table.pairs td { padding:4px 8px; vertical-align:top; }
  #histTable table.pairs td.side { max-width:340px; white-space:normal; }
  .acc-pick { position:relative; }
  .acc-pick summary { cursor:pointer; list-style:none; background:var(--bg); border:1px solid var(--border);
                      border-radius:8px; padding:7px 10px; font-size:14px; }
  .acc-pick[open] > div { position:absolute; z-index:10; margin-top:4px; min-width:220px; background:var(--card);
                          border:1px solid var(--border); border-radius:8px; padding:8px 12px; }
  .acc-pick label { display:block; padding:4px 0; white-space:nowrap; cursor:pointer; }
  button.star { padding:4px 8px; }
  .ok { color:var(--green); } .bad { color:var(--red); } .warn { color:#f5b94a; }
</style>
</head>
<body>
<header>
  <h1>💶 <span data-i18n="app_title">Financie</span></h1>
  <nav>
    <button data-tab="overview" class="active" data-i18n="nav_overview"></button>
    <button data-tab="transactions" data-i18n="nav_transactions"></button>
    <button data-tab="budget" data-i18n="nav_budget"></button>
    <button data-tab="assets" data-i18n="nav_assets"></button>
    <button data-tab="import" data-i18n="nav_import"></button>
  </nav>
  <div class="hright">
    <span id="gemmaStatus"></span>
    <select id="langSel">
      <option value="sk">SK</option><option value="de">DE</option><option value="en">EN</option>
    </select>
  </div>
</header>
<main>

<section id="tab-overview">
  <div class="toolbar">
    <select id="ovPreset">
      <option value="this_month" data-i18n="p_this_month"></option>
      <option value="last_month" data-i18n="p_last_month"></option>
      <option value="this_year" data-i18n="p_this_year"></option>
      <option value="last_year" data-i18n="p_last_year"></option>
      <option value="all" data-i18n="p_all"></option>
      <option value="custom" data-i18n="p_custom"></option>
    </select>
    <button class="btn" onclick="shiftPeriod(-1)">◀</button>
    <input type="date" id="ovFrom"> – <input type="date" id="ovTo">
    <button class="btn" onclick="shiftPeriod(1)">▶</button>
    <select id="ovAccPreset">
      <option value="main" data-i18n="acc_main_view"></option>
      <option value="satellite" data-i18n="acc_satellite_view"></option>
      <option value="all" data-i18n="all_accounts"></option>
      <option value="custom" data-i18n="acc_custom_view"></option>
    </select>
    <details class="acc-pick" id="ovAccPick"><summary id="ovAccSummary"></summary><div id="ovAccList"></div></details>
    <details class="acc-pick" id="ovPanels"><summary>📊 <span data-i18n="panels_btn"></span></summary><div>
      <label><input type="checkbox" value="summary" onchange="togglePanel(this)"> <span data-i18n="panel_summary"></span></label>
      <label><input type="checkbox" value="categories" onchange="togglePanel(this)"> <span data-i18n="expenses_by_cat"></span></label>
      <label><input type="checkbox" value="monthly" onchange="togglePanel(this)"> <span data-i18n="monthly_trend"></span></label>
      <label><input type="checkbox" value="balances" onchange="togglePanel(this)"> <span data-i18n="balance_trend"></span></label>
    </div></details>
    <span class="hint" id="ovAccHint"></span>
    <span class="warn" id="ovCoverage"></span>
  </div>
  <div class="cards panel" data-panel="summary">
    <div class="card"><div class="label" data-i18n="income"></div><div class="value green" id="ovIncome">–</div></div>
    <div class="card"><div class="label" data-i18n="expenses"></div><div class="value red" id="ovExpense">–</div></div>
    <div class="card hidden" id="ovTransfersCard"><div class="label" data-i18n="transfers_other"></div><div class="value" id="ovTransfers">–</div></div>
    <div class="card"><div class="label" data-i18n="month_balance"></div><div class="value" id="ovNet">–</div></div>
    <div class="card"><div class="label" data-i18n="net_worth"></div><div class="value" id="ovNW">–</div></div>
  </div>
  <div class="panels">
    <div class="card panel" data-panel="categories"><h2 class="panel-head" onclick="collapsePanel(this)"><span data-i18n="expenses_by_cat"></span></h2>
      <div class="panel-body chart-box"><canvas id="catChart"></canvas></div></div>
    <div class="card panel" data-panel="monthly"><h2 class="panel-head" onclick="collapsePanel(this)"><span data-i18n="monthly_trend"></span></h2>
      <div class="panel-body chart-box"><canvas id="monthChart"></canvas></div></div>
    <div class="card panel wide" data-panel="balances"><h2 class="panel-head" onclick="collapsePanel(this)"><span data-i18n="balance_trend"></span></h2>
      <div class="panel-body"><div class="bal-chart"><canvas id="balChart"></canvas></div>
        <div class="hint hidden" id="balEmpty" data-i18n="bal_empty"></div>
        <div class="hint" id="balGaps"></div></div></div>
  </div>
</section>

<section id="tab-transactions" class="hidden">
  <div class="toolbar">
    <button class="btn" onclick="shiftTxPeriod(-1)">◀</button>
    <select id="txYear"></select>
    <select id="txMonth"></select>
    <button class="btn" onclick="shiftTxPeriod(1)">▶</button>
    <select id="txAccount"></select>
    <input type="search" id="txSearch" data-i18n-ph="search_ph">
    <label><input type="checkbox" id="txUncat"> <span data-i18n="only_uncat"></span></label>
    <button class="btn" onclick="recat()">🤖 <span data-i18n="recat_btn"></span></button>
    <span id="recatMsg" class="hint"></span>
  </div>
  <div class="card"><table id="txTable">
    <colgroup>
      <col class="c-date"><col class="c-acct"><col><col class="c-cparty">
      <col class="c-cat"><col class="c-amt"><col class="c-del">
    </colgroup>
    <thead><tr><th data-i18n="col_date"></th><th data-i18n="col_account"></th><th data-i18n="col_desc"></th><th data-i18n="col_cparty"></th><th data-i18n="col_cat"></th><th class="num" id="txAmountHead" data-i18n="col_amount"></th><th></th></tr></thead>
    <tbody></tbody></table></div>
</section>

<section id="tab-budget" class="hidden">
  <div class="toolbar"><input type="month" id="buMonth"><span class="hint" data-i18n="budget_hint"></span></div>
  <div class="toolbar">
    <input id="newCatName" data-i18n-ph="new_cat_ph">
    <select id="newCatKind"><option value="expense" data-i18n="kind_expense"></option><option value="income" data-i18n="kind_income"></option></select>
    <button class="btn" onclick="addCat()" data-i18n="add_cat_btn"></button>
  </div>
  <div class="card"><table id="buTable">
    <thead><tr><th data-i18n="col_cat"></th><th class="num" data-i18n="col_limit"></th><th class="num" data-i18n="col_spent"></th><th style="width:30%" data-i18n="col_progress"></th><th></th></tr></thead>
    <tbody></tbody></table></div>
</section>

<section id="tab-assets" class="hidden">
  <div class="cards">
    <div class="card"><div class="label" data-i18n="accounts_total"></div><div class="value" id="nwAccounts">–</div></div>
    <div class="card"><div class="label" data-i18n="assets_liabilities"></div><div class="value" id="nwAssets">–</div></div>
    <div class="card"><div class="label" data-i18n="net_worth"></div><div class="value" id="nwTotal">–</div></div>
  </div>
  <div class="row">
    <div class="card">
      <h2 data-i18n="assets_liabilities"></h2>
      <table id="assetTable"><thead><tr><th data-i18n="col_name"></th><th data-i18n="col_type"></th><th class="num" data-i18n="col_value"></th><th></th></tr></thead><tbody></tbody></table>
      <div class="toolbar" style="margin-top:12px">
        <input id="newAssetName" data-i18n-ph="asset_name_ph">
        <select id="newAssetType">
          <option value="real_estate" data-i18n="at_real_estate"></option><option value="etf">ETF</option>
          <option value="stocks" data-i18n="at_stocks"></option><option value="crypto" data-i18n="at_crypto"></option>
          <option value="pension" data-i18n="at_pension"></option><option value="liability" data-i18n="at_liability"></option>
          <option value="other" data-i18n="at_other"></option>
        </select>
        <button class="btn primary" onclick="addAsset()" data-i18n="add_btn"></button>
      </div>
      <div class="toolbar">
        <select id="valAsset"></select>
        <input type="date" id="valDate">
        <input type="number" step="0.01" id="valValue" data-i18n-ph="value_ph">
        <button class="btn" onclick="addValue()" data-i18n="save_valuation"></button>
      </div>
    </div>
    <div class="card"><h2 data-i18n="asset_trend"></h2><canvas id="nwChart"></canvas></div>
  </div>
</section>

<section id="tab-import" class="hidden">
  <div class="msg" data-i18n-html="import_info"></div>
  <div class="card">
    <div class="toolbar">
      <span class="hint" data-i18n="imp_folder"></span>
      <input id="impDir" style="flex:1;min-width:240px" data-i18n-ph="imp_folder_ph">
      <button class="btn" onclick="saveDir()" data-i18n="imp_folder_save"></button>
      <button class="btn" onclick="scanFolder()" data-i18n="imp_rescan"></button>
    </div>
    <div class="toolbar">
      <span class="hint" data-i18n="imp_or_pick"></span>
      <input type="file" id="impFiles" multiple accept=".csv,.xlsx,.xls,.xml,.zip,.pdf,.png,.jpg,.jpeg,.webp">
    </div>
    <div class="toolbar">
      <select id="impKind">
        <option value="" data-i18n="f_all_kinds"></option>
        <option value="csv" data-i18n="kind_csv"></option>
        <option value="excel" data-i18n="kind_excel"></option>
        <option value="camt" data-i18n="kind_camt"></option>
        <option value="pdf" data-i18n="kind_pdf"></option>
        <option value="image" data-i18n="kind_image"></option>
      </select>
      <select id="impState">
        <option value="" data-i18n="f_all_states"></option>
        <option value="todo" data-i18n="f_todo"></option>
        <option value="imported" data-i18n="f_imported"></option>
        <option value="failed" data-i18n="f_failed"></option>
      </select>
      <button class="btn primary" id="impGoBtn" onclick="importAll()" disabled></button>
    </div>
    <div id="impResult" class="hint"></div>
    <div class="scroll-x"><table id="impTable" class="hidden" style="margin-top:8px">
      <thead><tr><th><input type="checkbox" id="impChkAll" onchange="checkAll(this.checked)"></th>
        <th data-i18n="col_file"></th><th data-i18n="col_type"></th><th data-i18n="col_format"></th>
        <th data-i18n="col_period"></th><th class="num" data-i18n="col_rows"></th><th data-i18n="col_status"></th>
        <th data-i18n="col_account"></th><th data-i18n="col_result"></th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h2 data-i18n="history_title"></h2>
    <div class="scroll-x"><table id="histTable">
      <thead><tr><th></th><th>#</th><th data-i18n="col_time"></th><th data-i18n="col_file"></th><th data-i18n="col_format"></th>
        <th data-i18n="col_account"></th><th data-i18n="col_period"></th><th data-i18n="col_result"></th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="toolbar">
      <input id="newAccName" data-i18n-ph="acc_name_ph">
      <select id="newAccType">
        <option value="checking" data-i18n="acct_checking"></option>
        <option value="savings" data-i18n="acct_savings"></option>
        <option value="credit_card" data-i18n="acct_credit_card"></option>
        <option value="cash" data-i18n="acct_cash"></option>
        <option value="investment" data-i18n="acct_investment"></option>
        <option value="other" data-i18n="acct_other"></option>
      </select>
      <button class="btn" onclick="addAccount()" data-i18n="add_acc_btn"></button>
      <span class="hint" data-i18n="acc_hint"></span>
    </div>
    <table id="accTable" style="margin-top:8px">
      <thead><tr><th></th><th data-i18n="col_name"></th><th data-i18n="col_type"></th><th data-i18n="col_coverage"></th>
        <th class="num" data-i18n="col_balance"></th><th></th><th></th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

</main>
<script>

  bal_gap:(a, f, to)=>`↔ ${a}: chýbajú dáta ${f} – ${to}, zostatky pred medzerou podľa banky`, bal_total:'Spolu', bal_checks:'Kontroly zostatku',

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) {
    let d; try { d = (await r.json()).detail; } catch { d = r.statusText; }
    if (d && typeof d === 'object' && d.code)
      throw new Error(t('err_'+d.code) + (d.info ? ': '+d.info : ''));
    throw new Error(typeof d === 'string' ? d : r.statusText);
  }
  return r.json();
}

function chart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($('#'+id), cfg);
}

function presetRange(p) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  switch (p) {
    case 'this_month': return [ymd(new Date(y, m, 1)), ymd(new Date(y, m+1, 0))];
    case 'last_month': return [ymd(new Date(y, m-1, 1)), ymd(new Date(y, m, 0))];
    case 'this_year':  return [`${y}-01-01`, `${y}-12-31`];
    case 'last_year':  return [`${y-1}-01-01`, `${y-1}-12-31`];
    case 'all':        return ['1970-01-01', '2100-12-31'];
    default:           return [$('#ovFrom').value, $('#ovTo').value];
  }
}

function shiftPeriod(dir) {
  const from = new Date($('#ovFrom').value), to = new Date($('#ovTo').value);
  if (isNaN(from) || isNaN(to)) return;
  const iso = d => d.toISOString().slice(0,10);
  const isMonthStart = from.getUTCDate() === 1;
  const nextDay = new Date(to); nextDay.setUTCDate(nextDay.getUTCDate() + 1);
  const isMonthEnd = nextDay.getUTCDate() === 1;
  if (isMonthStart && isMonthEnd) {
    // whole calendar months -> shift by the same number of months
    const months = (to.getUTCFullYear()-from.getUTCFullYear())*12
                 + (to.getUTCMonth()-from.getUTCMonth()) + 1;
    const nf = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth() + dir*months, 1));
    const nt = new Date(Date.UTC(nf.getUTCFullYear(), nf.getUTCMonth() + months, 0));
    $('#ovFrom').value = iso(nf); $('#ovTo').value = iso(nt);
  } else {
    const days = Math.round((to - from) / 86400000) + 1;
    from.setUTCDate(from.getUTCDate() + dir*days);
    to.setUTCDate(to.getUTCDate() + dir*days);
    $('#ovFrom').value = iso(from); $('#ovTo').value = iso(to);
  }
  $('#ovPreset').value = 'custom';
  loadOverview();
}

// Which accounts the overview covers: the main one(s) by default, the satellites (PayPal,
// cards) without them, all, or a custom choice. Remembered in this browser.
let ovAccounts = [];
function ovPick() {
  try { return JSON.parse(localStorage.getItem('ovAccounts')) || {preset:'main', ids:[]}; }
  catch { return {preset:'main', ids:[]}; }
}
function saveOvPick(pick) { try { localStorage.setItem('ovAccounts', JSON.stringify(pick)); } catch {} }
function ovSelected() {
  const pick = ovPick(), all = ovAccounts.map(a => a.id), mains = ovAccounts.filter(a => a.is_main).map(a => a.id);
  if (pick.preset === 'main') return mains.length ? mains : all;
  if (pick.preset === 'satellite') return ovAccounts.filter(a => !a.is_main).map(a => a.id);
  if (pick.preset === 'custom') return pick.ids.filter(id => all.includes(id));
  return all;
}
function renderOvPick(sel) {
  const pick = ovPick();
  $('#ovAccPreset').value = pick.preset;
  $('#ovAccList').innerHTML = ovAccounts.map(a => `<label><input type="checkbox" value="${a.id}"
    ${sel.includes(a.id) ? 'checked' : ''} onchange="pickAccounts()"> ${a.is_main ? '⭐ ' : ''}${esc(a.name)}</label>`).join('');
  $('#ovAccSummary').textContent = t('acc_selected')(sel.length, ovAccounts.length);
  $('#ovAccHint').textContent = pick.preset === 'main' && !ovAccounts.some(a => a.is_main) ? t('acc_no_main') : '';
}
function coverageHint(sel, from) {
  const late = ovAccounts.filter(a => sel.includes(a.id) && (!a.first_date || a.first_date > from));
  $('#ovCoverage').textContent = late.length ? t('cov_late')(late.map(a =>
    a.first_date ? t('cov_from')(a.name, a.first_date) : t('cov_none')(a.name)).join(', ')) : '';
}
function pickAccounts() {
  saveOvPick({preset:'custom', ids:[...document.querySelectorAll('#ovAccList input:checked')].map(i => +i.value)});
  loadOverview();
}

async function loadOverview() {
  const p = $('#ovPreset').value;
  const [from, to] = presetRange(p);
  if (p !== 'custom') { $('#ovFrom').value = from; $('#ovTo').value = to; }
  if (!from || !to) return;
  ovAccounts = await api('/api/accounts');
  const sel = ovSelected(), all = sel.length === ovAccounts.length;
  renderOvPick(sel);
  coverageHint(sel, from);
  const accParam = all ? '' : `&accounts=${sel.join(',')}`;
  const [ov, nw, bal] = await Promise.all([
    api(`/api/overview?date_from=${from}&date_to=${to}` + accParam),
    api('/api/networth'),
    api(`/api/balances?date_from=${from}&date_to=${to}` + accParam)]);
  $('#ovIncome').textContent = fmt(ov.income);
  $('#ovExpense').textContent = fmt(ov.expense);
  // transfers to and from the accounts left out; among all accounts they cancel out
  $('#ovTransfersCard').classList.toggle('hidden', all && Math.abs(ov.transfers) < 0.005);
  $('#ovTransfers').textContent = fmt(ov.transfers);
  const net = ov.income + ov.expense + ov.transfers;
  $('#ovNet').textContent = fmt(net); $('#ovNet').className = 'value ' + (net>=0?'green':'red');
  $('#ovNW').textContent = fmt(nw.net_worth);
  chart('catChart', {type:'doughnut', data:{labels:ov.by_category.map(x=>catLabel(x.category_key, x.category)),
    datasets:[{data:ov.by_category.map(x=>x.spent)}]},
    options:{maintainAspectRatio:false, plugins:{legend:{position:'right',labels:{color:'#e8ecf4'}}}}});
  chart('monthChart', {type:'bar', data:{labels:ov.monthly.map(x=>x.month),
    datasets:[{label:t('income'),data:ov.monthly.map(x=>x.income),backgroundColor:'#3ecf8e'},
              {label:t('expenses'),data:ov.monthly.map(x=>x.expense),backgroundColor:'#ff6b6b'}]},
    options:{maintainAspectRatio:false, scales:{x:{ticks:{color:'#8b96ab'}},y:{ticks:{color:'#8b96ab'}}},
             plugins:{legend:{labels:{color:'#e8ecf4'}}}}});
  balanceChart(bal);
}

// Overview panels, as on a dashboard: shown or hidden from the 📊 menu, collapsed to their title
// by clicking it; remembered in this browser. A chart that shows again resizes by itself.
function panelState() {
  try {
    const s = JSON.parse(localStorage.getItem('ovPanels')) || {};
    return {hidden: s.hidden || [], collapsed: s.collapsed || []};
  } catch { return {hidden: [], collapsed: []}; }
}
function savePanels(s) { try { localStorage.setItem('ovPanels', JSON.stringify(s)); } catch {} }
function applyPanels() {
  const s = panelState();
  document.querySelectorAll('#tab-overview [data-panel]').forEach(p => {
    p.classList.toggle('hidden', s.hidden.includes(p.dataset.panel));
    p.classList.toggle('collapsed', s.collapsed.includes(p.dataset.panel));
  });
  document.querySelectorAll('#ovPanels input').forEach(i => { i.checked = !s.hidden.includes(i.value); });
}
function togglePanel(input) {
  const s = panelState();
  s.hidden = s.hidden.filter(x => x !== input.value).concat(input.checked ? [] : [input.value]);
  savePanels(s); applyPanels();
}
function collapsePanel(head) {
  const id = head.closest('[data-panel]').dataset.panel, s = panelState();
  s.collapsed = s.collapsed.includes(id) ? s.collapsed.filter(x => x !== id) : [...s.collapsed, id];
  savePanels(s); applyPanels();
}

// End-of-day balance per account: the balance holds until the next movement (a stepped line),
// the total once every account has data, and the balance checks as points (✓ matches, ⚠ off)
const BAL_COLORS = ['#4f8cff', '#3ecf8e', '#f5a623', '#c77dff', '#ff6b6b', '#2ec4d6', '#e5d352', '#ff8fab'];
function balanceChart(bal) {
  const ms = d => Date.parse(d), day = v => new Date(v).toISOString().slice(0, 10);
  const lines = bal.accounts.filter(a => a.points.length);
  $('#balEmpty').classList.toggle('hidden', lines.length > 0);
  $('.bal-chart').classList.toggle('hidden', !lines.length);
  // holes in a history: the line breaks there, the balances before it follow the bank's own
  $('#balGaps').textContent = lines.flatMap(a => a.gaps.map(g => t('bal_gap')(a.name, g.from, g.to))).join(' · ');
  const datasets = lines.map((a, i) => ({
    label: (a.is_main ? '⭐ ' : '') + a.name, data: a.points.map(p => ({x: ms(p.date), y: p.balance})),
    borderColor: BAL_COLORS[i % BAL_COLORS.length], backgroundColor: BAL_COLORS[i % BAL_COLORS.length],
    stepped: 'after', pointRadius: 0, pointHitRadius: 6, borderWidth: 2}));
  if (lines.length > 1 && bal.total.length)
    datasets.push({label: t('bal_total'), data: bal.total.map(p => ({x: ms(p.date), y: p.balance})),
      borderColor: '#e8ecf4', backgroundColor: '#e8ecf4', borderDash: [6, 4], stepped: 'after',
      pointRadius: 0, pointHitRadius: 6, borderWidth: 1.5});
  const DAY = 86400000, xMin = lines.length ? Math.min(...lines.map(a => ms(a.points[0].date))) : undefined;
  const step = xMin === undefined ? undefined : DAY * Math.max(1, Math.ceil((ms(bal.to) - xMin) / DAY / 8));
  const checks = lines.flatMap(a => a.checks.map(c => ({x: ms(c.date), y: c.amount, acc: a.name, diff: c.difference})));
  if (checks.length)
    datasets.push({type: 'scatter', label: t('bal_checks'), data: checks,
      pointRadius: checks.map(c => c.diff ? 7 : 5), pointHoverRadius: 9,
      pointStyle: checks.map(c => c.diff ? 'triangle' : 'circle'),
      backgroundColor: checks.map(c => c.diff ? '#ff6b6b' : '#3ecf8e'), borderColor: '#0f1420'});
  chart('balChart', {type: 'line', data: {datasets},
    options: {maintainAspectRatio: false, interaction: {mode: 'nearest', intersect: false},
      scales: {x: {type: 'linear', min: xMin, max: ms(bal.to),   // whole days, at most ~8 labels
                   ticks: {color: '#8b96ab', stepSize: step, callback: v => day(v)}},
               y: {ticks: {color: '#8b96ab', callback: v => fmt(v)}}},
      plugins: {legend: {labels: {color: '#e8ecf4'}},
        tooltip: {callbacks: {title: items => items.length ? day(items[0].parsed.x) : '',
          label: c => c.raw.acc === undefined ? `${c.dataset.label}: ${fmt(c.parsed.y)}`
            : c.raw.diff ? t('bal_check_off')(c.raw.acc, fmt(c.raw.y), fmt(c.raw.diff))
            : t('bal_check_ok')(c.raw.acc, fmt(c.raw.y))}}}}});
}

// Period of the Transactions tab: a year (or all) and a month of it (or the whole year). Two
// plain lists instead of a month input, whose year cannot be changed on its own.
let txPeriod = null;   // {year, month}: '' = all years / the whole year
async function fillTxPeriod() {
  if (!txPeriod) txPeriod = {year: thisMonth.slice(0, 4), month: thisMonth.slice(5)};
  const years = await api('/api/transactions/years');
  for (const y of [thisMonth.slice(0, 4), txPeriod.year]) if (y && !years.includes(y)) years.push(y);
  years.sort().reverse();
  $('#txYear').innerHTML = `<option value="">${t('all_years')}</option>` +
    years.map(y => `<option value="${y}">${y}</option>`).join('');
  const names = new Intl.DateTimeFormat(LOCALE[lang], {month: 'long'});
  $('#txMonth').innerHTML = `<option value="">${t('whole_year')}</option>` +
    Array.from({length: 12}, (_, i) => String(i + 1).padStart(2, '0')).map(m =>
      `<option value="${m}">${names.format(new Date(2000, +m - 1, 15))}</option>`).join('');
  $('#txYear').value = txPeriod.year;
  $('#txMonth').value = txPeriod.month;
  $('#txMonth').disabled = !txPeriod.year;
}
function readTxPeriod() { txPeriod = {year: $('#txYear').value, month: $('#txMonth').value}; }
// ◀ ▶: the previous or next month, or year when the whole year is shown
function shiftTxPeriod(step) {
  const {year, month} = txPeriod || {};
  if (!year) return;
  if (!month) txPeriod.year = String(+year + step);
  else {
    const d = new Date(+year, +month - 1 + step, 15);
    txPeriod = {year: String(d.getFullYear()), month: String(d.getMonth() + 1).padStart(2, '0')};
  }
  loadTransactions();
}

async function loadTransactions() {
  await fillTxPeriod();
  {
    const accs = await api('/api/accounts');
    const cur = $('#txAccount').value;
    $('#txAccount').innerHTML = `<option value="">${t('all_accounts')}</option>` +
      accs.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
    $('#txAccount').value = cur;
  }
  const p = new URLSearchParams();
  const year = $('#txYear').value, month = $('#txMonth').value;
  if (year && month) p.set('month', `${year}-${month}`);
  else if (year) { p.set('year', year); p.set('limit', '10000'); }   // a whole year has more than 500
  if ($('#txAccount').value) p.set('account_id', $('#txAccount').value);
  if ($('#txSearch').value) p.set('q', $('#txSearch').value);
  if ($('#txUncat').checked) p.set('uncategorized','true');
  const txs = await api('/api/transactions?'+p);
  // the API sorts by kind and English name; keep the kinds together, sort each by the shown label
  const cats = categories.map(c => ({...c, label: catLabel(c.key, c.name)}))
    .sort((a, b) => a.kind.localeCompare(b.kind) || byLabel(a, b));
  const opts = cid => '<option value="">—</option>' + cats.map(c =>
    `<option value="${c.id}" ${c.id===cid?'selected':''}>${c.label}</option>`).join('');
  $('#txTable tbody').innerHTML = txs.map(t2 => `<tr>
    <td class="nowrap">${t2.date}</td><td class="hint nowrap">${t2.account}</td>
    <td class="nowrap" title="${(t2.description||'').replace(/"/g,'&quot;')}">${t2.description||''}</td>
    <td class="nowrap" title="${(t2.counterparty||'').replace(/"/g,'&quot;')}">${t2.counterparty||''}</td>
    <td><select onchange="setCat(${t2.id}, this.value)">${opts(t2.category_id)}</select></td>
    <td class="num"><span class="${t2.amount>=0?'green':'red'}">${fmt(t2.amount)}</span>${t2.running_balance == null
      ? '' : `<br><span class="hint" title="${esc(t('running_title'))}">${fmt(t2.running_balance)}</span>`}</td>
    <td><button class="btn" onclick="delTx(${t2.id})">✕</button></td></tr>`).join('');
  $('#txAmountHead').textContent = t($('#txAccount').value ? 'col_amount_running' : 'col_amount');
}
async function setCat(id, v) {
  await api('/api/transactions/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category_id: v?+v:null})});
}
async function delTx(id) {
  if (!confirm(t('del_tx_confirm'))) return;
  await api('/api/transactions/'+id, {method:'DELETE'}); loadTransactions();
}
async function recat() {
  $('#recatMsg').textContent = t('recat_working');
  try {
    const r = await api('/api/categorize', {method:'POST'});
    $('#recatMsg').textContent = t('recat_done')(r.learned + r.categorized, r.remaining);
    loadTransactions();
  } catch(e) { $('#recatMsg').textContent = t('error')+': '+e.message; }
}

async function loadBudget() {
  const m = $('#buMonth').value || thisMonth;
  const b = await api('/api/budget?month='+m);
  const items = b.items.map(i => ({...i, label: catLabel(i.category_key, i.category)})).sort(byLabel);
  $('#buTable tbody').innerHTML = items.map(i => {
    const pct = i.budget ? Math.min(100, i.spent/i.budget*100) : 0;
    const label = i.label;
    return `<tr><td>${label}</td>
      <td class="num"><input type="number" style="width:90px" value="${i.budget??''}"
        onkeydown="if(event.key==='Enter')saveBudget(${i.category_id},this.value)"></td>
      <td class="num">${fmt(i.spent)}</td>

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadImport() {
  const accs = await api('/api/accounts');
  $('#accTable tbody').innerHTML = accs.map(a => `<tr>
    <td><button class="btn star" title="${esc(t('main_toggle'))}" onclick="toggleMain(${a.id}, ${!a.is_main})">${a.is_main ? '⭐' : '☆'}</button></td>
    <td>${esc(a.name)}</td><td class="hint">${t('acct_'+a.type) !== 'acct_'+a.type ? t('acct_'+a.type) : a.type}</td>
    <td class="nowrap hint">${a.first_date ? `${a.first_date} – ${a.last_date}` : '–'}</td>
    <td class="num">${fmt(a.balance)}<br><span class="hint ${a.balance_date ? '' : 'warn'}">${a.balance_date
      ? t('bal_known')(a.balance_date) : t('bal_unknown')}</span>${checkStatus(a)}</td>
    <td><button class="btn" title="${esc(t('bal_set_title'))}" onclick="setBalance(${a.id})">✎</button></td>
    <td><button class="btn" title="${esc(t('check_title'))}" onclick="checkBalance(${a.id})">⚖</button></td>
    <td><button class="btn" onclick="delAccount(${a.id}, '${a.name.replace(/'/g,"\\'")}')">✕</button></td></tr>`).join('');
  impAccs = accs;
  loadHistory();
  if (!folderScanned) { folderScanned = true; scanFolder(accs); }
  else renderImpTable(accs);
  return accs;
}
async function toggleMain(id, on) {
  await api('/api/accounts/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({is_main: on})});

}
// A known balance (from the banking app, a statement) at the end of a day: the balance no
// longer depends on having the whole history. An empty amount removes it.
// Ask for a balance and its day: {amount, date}, {amount:null} for an empty amount, null when cancelled
function askBalance(question, amount, day) {
  const text = prompt(question, amount ?? '');
  if (text === null) return null;
  if (!text.trim()) return {amount: null};
  let v = text.replace(/[\s€]/g, '');
  // the last separator is the decimal one: 1.234,56 or 1,234.56
  v = v.lastIndexOf(',') > v.lastIndexOf('.') ? v.replace(/\./g, '').replace(',', '.') : v.replace(/,/g, '');
  if (v === '' || isNaN(+v)) { alert(t('bal_bad_amount')); return null; }
  const when = prompt(t('bal_prompt_date'), day || ymd(new Date()));
  if (when === null) return null;
  const m = when.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);   // 31.10.2026
  return {amount: +v, date: m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : when.trim()};
}
async function setBalance(id) {
  const a = impAccs.find(x => x.id === id);
  const b = askBalance(t('bal_prompt_amount')(a.name), a.balance_amount, a.balance_date);
  if (!b) return;
  const body = b.amount === null ? {balance_amount: null} : {balance_amount: b.amount, balance_date: b.date};
  try {
    await api('/api/accounts/'+id, {method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)});
    loadImport();
  } catch(e) { alert(e.message); }
}
// Balance checks: the real balance from the bank next to the computed one; the anchor stays
function checkStatus(a) {
  const c = a.checks?.[0];
  if (!c) return '';
  const title = a.checks.map(x => t('check_line')(x)).join('\n');
  return `<br><span class="hint ${c.difference ? 'warn' : 'ok'}" title="${esc(title)}">${c.difference
    ? t('check_diff_short')(fmt(c.difference), c.date) : t('check_ok_short')(c.date)}</span>`;
}
async function checkBalance(id) {
  const a = impAccs.find(x => x.id === id);
  const b = askBalance(t('check_prompt')(a.name), '', a.checks?.[0]?.date);
  if (!b || b.amount === null) return;
  try {
    const c = await api(`/api/accounts/${id}/checks`, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(b)});
    alert(c.difference ? t('check_diff')(c) : t('check_ok')(c));
    loadImport();
  } catch(e) { alert(e.message); }
}
async function delAccount(id, name) {
  if (!confirm(t('del_acc_confirm')(name))) return;
  try { await api('/api/accounts/'+id, {method:'DELETE'}); loadImport(); }
  catch(e) { alert(e.message); }
}

// Statements from the folder and picked files, in one table. Looking at them writes nothing;
// only GO imports the ticked rows that the filters show.
let folderRows = [], pickedRows = [], impRows = [], impAccs = [], folderScanned = false;
let ownProposals = [];  // new accounts named by the user in the account picker
const STATE_ORDER = {new:0, changed:1, failed:2, imported:3};
const sortRows = rows => rows.sort((a, b) => (STATE_ORDER[a.state] - STATE_ORDER[b.state]) || (a.gemma - b.gemma)
  || (a.key||'').localeCompare(b.key||'') || (a.date_from||'').localeCompare(b.date_from||''));
const usable = r => !r.error && r.count !== 0;
function prepare(rows, source) {
  rows.forEach(r => {
    r.source = source;
    r.checked = usable(r) && !r.gemma && (r.state === 'new' || r.state === 'changed');
  });
  return sortRows(rows);
}

async function saveDir() {
  try {
    await api('/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({imports_dir: $('#impDir').value})});
    scanFolder();
  } catch(e) { $('#impResult').textContent = t('error')+': '+e.message; }
}
async function scanFolder(accs) {
  $('#impResult').textContent = t('imp_scanning');
  try {
    const [res, a] = await Promise.all([api('/api/folder'), accs || api('/api/accounts')]);
    $('#impDir').value = res.dir || '';
    folderRows = prepare(res.files, 'folder');
    $('#impResult').textContent = res.dir ? t('imp_folder_files')(res.files.length, res.dir) : t('imp_no_folder');
    renderImpTable(a);
  } catch(e) {
    folderRows = [];
    $('#impResult').textContent = t('error')+': '+e.message;
    renderImpTable(accs || await api('/api/accounts'));
  }
}
async function previewFiles() {
  const files = [...$('#impFiles').files];
  if (!files.length) return;
  $('#impResult').textContent = t('analyzing');
  const fd = new FormData();
  files.forEach(f => fd.append('files', f));
  try {
    const rows = await api('/api/import/preview', {method:'POST', body:fd});
    rows.forEach((r, i) => { r.fileObj = files[i]; });
    pickedRows = prepare(rows, 'upload');
    $('#impResult').textContent = '';
    renderImpTable(await api('/api/accounts'));
  } catch(e) { $('#impResult').textContent = t('error')+': '+e.message; }
}

function visible(r) {
  const kind = $('#impKind').value, state = $('#impState').value;
  return (!kind || r.kind === kind)
      && (!state || (state === 'todo' ? r.state === 'new' || r.state === 'changed' : r.state === state));
}
function stateCell(r) {
  if (r.state === 'imported') return `<span class="ok">${t('st_imported')((r.last?.imported_at||'').slice(0,16))}</span>`;
  if (r.state === 'failed') return `<span class="bad" title="${esc(t('err_'+r.last?.error_code))}">${t('st_failed')}</span>`;
  if (r.state === 'changed') return `<span class="warn" title="${esc(t('st_changed_title'))}">${t('st_changed')}</span>`;
  return t('st_new');
}
function renderImpTable(accs) {
  impAccs = accs;
  impRows = [...pickedRows, ...folderRows];
  const proposals = [...new Map([...impRows.map(r => r.proposal).filter(Boolean), ...ownProposals]
    .filter(p => !accs.some(a => a.name === p.name)).map(p => [p.name, p])).values()];
  const selected = r => r.sel ?? (r.account_id ? String(r.account_id)
              : r.proposal && proposals.some(p => p.name === r.proposal.name) ? 'new:'+r.proposal.name : '');
  const options = r => {
    const sel = selected(r);
    return `<option value="">${t('choose_account')}</option>` +
      accs.map(a => `<option value="${a.id}" ${String(a.id)===sel?'selected':''}>${esc(a.name)}</option>`).join('') +
      proposals.map(p => `<option value="new:${esc(p.name)}" ${'new:'+p.name===sel?'selected':''}>${esc(t('new_account_opt')(p.name))}</option>`).join('') +
      `<option value="ask">${esc(t('new_account_ask'))}</option>`;
  };
  const shown = impRows.map((r, i) => [r, i]).filter(([r]) => visible(r));
  $('#impTable').classList.toggle('hidden', !impRows.length);
  $('#impTable tbody').innerHTML = shown.map(([r, i]) => {
    const ok = usable(r), name = r.path || r.file;
    const period = r.date_from ? `${r.date_from} – ${r.date_to}` : '–';
    const problem = r.error ? t('error')+': '+r.error : r.count === 0 ? t('imp_empty')
                  : r.no_amount ? t('imp_no_amount')(r.no_amount) : '';
    return `<tr>
      <td><input type="checkbox" ${r.checked ? 'checked' : ''} ${ok ? '' : 'disabled'} onchange="impRows[${i}].checked=this.checked; updateGo()"></td>
      <td class="file" title="${esc(name)}">${esc(name)}</td>
      <td class="hint">${r.kind ? t('kind_'+r.kind) : '–'}</td>
      <td>${esc(r.format || (r.gemma ? t('fmt_gemma') : '–'))}</td>
      <td class="nowrap hint">${period}</td>
      <td class="num">${r.count ?? '–'}</td>
      <td class="state">${stateCell(r)}</td>
      <td><select ${ok ? '' : 'disabled'} onchange="pickAccount(${i}, this)">${options(r)}</select></td>
      <td class="hint" id="impStatus${i}">${esc(r.result || problem)}</td></tr>`;
  }).join('');
  shown.forEach(([r]) => { r.sel = selected(r); });
  updateGo();
}
// "other new account…": ask for its name; it is created on GO like a proposed one
function pickAccount(i, el) {
  const r = impRows[i];
  if (el.value !== 'ask') { r.sel = el.value; return; }
  const name = (prompt(t('new_account_prompt')) || '').trim();
  if (name) {
    const existing = impAccs.find(a => a.name.toLowerCase() === name.toLowerCase());
    if (!existing && !ownProposals.some(p => p.name === name)) ownProposals.push({name, type:'other'});
    r.sel = existing ? String(existing.id) : 'new:'+name;
  }
  renderImpTable(impAccs);
}
const goRows = () => impRows.filter(r => r.checked && usable(r) && visible(r));
function updateGo() {
  const n = goRows().length, shown = impRows.filter(r => usable(r) && visible(r));
  $('#impGoBtn').textContent = t('go_btn')(n);
  $('#impGoBtn').disabled = !n;
  $('#impChkAll').checked = shown.length > 0 && shown.every(r => r.checked);
}
function checkAll(on) {
  impRows.filter(r => usable(r) && visible(r)).forEach(r => { r.checked = on; });
  renderImpTable(impAccs);
}
async function importAll() {
  const rows = goRows();
  if (!rows.length || !confirm(t('go_confirm')(rows.length))) return;
  $('#impGoBtn').disabled = true;
  const created = {};
  for (const r of rows) {
    const status = $('#impStatus'+impRows.indexOf(r));
    const show = text => { r.result = text; if (status) status.textContent = text; };
    let acc = r.sel;
    if (!acc) { show(t('imp_need_account')); continue; }
    try {
      if (acc.startsWith('new:')) {
        const p = [...impRows.map(x => x.proposal).filter(Boolean), ...ownProposals]
          .find(x => 'new:'+x.name === acc);
        if (!created[p.name]) {
          await api('/api/accounts', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({name:p.name, type:p.type})});
          created[p.name] = (await api('/api/accounts')).find(a => a.name === p.name).id;
        }
        acc = String(created[p.name]);
      }
      show(t('imp_running'));
      let res;
      if (r.source === 'folder') {
        res = await api('/api/folder/import', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({path:r.path, account_id:+acc})});
      } else {
        const fd = new FormData();
        fd.append('account_id', acc);
        fd.append('file', r.fileObj);
        res = await api('/api/import', {method:'POST', body:fd});
      }
      show(t('imp_row_done')(res));
      Object.assign(r, {state:'imported', checked:false, sel:acc,
                        last:{imported_at: ymd(new Date())+' '+new Date().toTimeString().slice(0,5)}});
    } catch(e) {
      show(t('error')+': '+e.message);
      if (r.state !== 'imported') r.state = 'failed';
    }
  }
  // newly created accounts become ordinary choices for the rows still left
  impRows.forEach(r => { if (r.sel?.startsWith('new:') && created[r.sel.slice(4)]) r.sel = String(created[r.sel.slice(4)]); });
  loadImport();
}

let histRows = [], openDups = null, dupPairs = [];
async function loadHistory() {
  const rows = histRows = await api('/api/imports');
  if (openDups && !rows.some(r => r.id === openDups && r.duplicates)) openDups = null;
  dupPairs = openDups ? await api(`/api/imports/${openDups}/duplicates`) : [];
  const result = r => {
    if (r.status === 'undone') return `<span class="hint">${t('hist_undone')}</span>`;
    if (r.status !== 'ok') return `<span class="bad">${esc(t('err_'+r.error_code) + (r.error_info ? ': '+r.error_info : ''))}</span>`;
    const dups = r.duplicates ? ` <a class="warn" onclick="toggleDups(${r.id})">${t('hist_dups')(r.duplicates,
      r.duplicate_of.map(id => id ? '#'+id : t('hist_older')).join(', '))}</a>` : '';
    // the live duplicate count replaces the one reported at import time
    return `<span class="ok">${t('imp_row_done')({...r, possible_duplicates:0})}</span>${dups}`;
  };
  // undo first: the result column can be wide, and the table scrolls sideways
  $('#histTable tbody').innerHTML = rows.length ? rows.map(r => `<tr>
    <td>${r.status === 'ok' && r.remaining ? `<button class="btn" title="${esc(t('undo_btn'))}"
      onclick="undoImport(${r.id})">↶</button>` : ''}</td>
    <td class="hint">#${r.id}</td>
    <td class="nowrap hint">${esc(r.imported_at.slice(0,16))}</td>
    <td class="file" title="${esc(r.file_name)}">${esc(r.file_name)}</td>
    <td>${esc(r.format || '–')}</td>
    <td>${esc(r.account || '–')}</td>
    <td class="nowrap hint">${r.date_from ? `${r.date_from} – ${r.date_to}` : '–'}</td>
    <td class="state">${result(r)}</td></tr>` + (r.id === openDups ? dupsRow() : '')).join('')
    : `<tr><td colspan="8" class="hint">${t('hist_empty')}</td></tr>`;
}

// The pairs behind "possible duplicates": the user decides what each one is
function dupsRow() {
  const side = (x, label) => `<td class="side"><span class="hint">${label} · ${esc(x.account)}</span><br>
    ${esc([x.counterparty, x.description].filter(Boolean).join(' · ') || '–')}<br>
    <button class="btn" title="${esc(t('dup_transfer_title'))}" onclick="dupTransfer(${x.id})">${t('dup_transfer_btn')}</button>
    <button class="btn" title="${esc(t('dup_delete_title'))}" onclick="dupDelete(${x.id})">✕</button></td>`;
  return `<tr class="dups"><td colspan="8"><p class="hint">${t('dup_hint')}</p><table class="pairs">` +
    dupPairs.map(d => `<tr><td class="nowrap">${d.date}</td><td class="num nowrap">${fmt(d.amount)}</td>
      ${side(d.tx, t('dup_this'))}
      ${side(d.twin, d.twin.import_id ? '#'+d.twin.import_id : t('hist_older'))}</tr>`).join('') +
    `</table></td></tr>`;
}
function toggleDups(id) {
  openDups = openDups === id ? null : id;
  loadHistory();
}
async function dupTransfer(txId) {
  const transfer = (await api('/api/categories')).find(c => c.key === 'transfer');
  await api('/api/transactions/'+txId, {method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({category_id: transfer.id})});
  loadHistory();
}
async function dupDelete(txId) {
  const d = dupPairs.find(p => p.tx.id === txId || p.twin.id === txId);
  if (!confirm(t('dup_delete_confirm')(d.date, fmt(d.amount)))) return;
  await api('/api/transactions/'+txId, {method:'DELETE'});
  loadHistory();
}
async function undoImport(id) {
  const r = histRows.find(x => x.id === id);
  if (!confirm(t('undo_confirm')(r.remaining, r.file_name))) return;
  try {
    const res = await api('/api/imports/'+id, {method:'DELETE'});
    await scanFolder();
    await loadImport();
    $('#impResult').textContent = t('undo_done')(res.deleted);
  } catch(e) { alert(e.message); }
}

function load(tab) {
  ({overview:loadOverview, transactions:loadTransactions, budget:loadBudget,
    assets:loadAssets, import:loadImport}[tab])();
}

async function refreshStatus() {
  const st = await api('/api/status');
  $('#gemmaStatus').textContent = st.gemma ? t('gemma_ready')(st.model) : t('gemma_off');
  $('#gemmaStatus').style.color = st.gemma ? '#3ecf8e' : '#8b96ab';
}

$('#langSel').value = lang;
$('#langSel').onchange = () => {
  lang = $('#langSel').value;
  localStorage.setItem('lang', lang);
  applyI18n(); refreshStatus();
  load(document.querySelector('nav .active').dataset.tab);
};

(async function init() {
  applyI18n();
  $('#buMonth').value = thisMonth;
  $('#ovPreset').addEventListener('change', loadOverview);
  $('#ovAccPreset').addEventListener('change', () => {
    saveOvPick({preset:$('#ovAccPreset').value, ids:ovSelected()});
    loadOverview();
  });
  $('#impFiles').addEventListener('change', previewFiles);
  ['#impKind','#impState'].forEach(sel => {
    try { $(sel).value = localStorage.getItem('filter'+sel) || ''; } catch {}
    $(sel).addEventListener('change', () => {
      try { localStorage.setItem('filter'+sel, $(sel).value); } catch {}
      renderImpTable(impAccs);
    });
  });
  ['#ovFrom','#ovTo'].forEach(s => $(s).addEventListener('change', () => {
    $('#ovPreset').value = 'custom'; loadOverview();
  }));
  ['#txYear','#txMonth'].forEach(s => $(s).addEventListener('change', () => { readTxPeriod(); loadTransactions(); }));
  ['#txAccount','#txSearch','#txUncat','#buMonth'].forEach(s =>
    $(s).addEventListener('change', () => load(document.querySelector('nav .active').dataset.tab)));
  applyPanels();
  categories = await api('/api/categories');
  refreshStatus();
  loadOverview();
})();
